version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server
    restart: unless-stopped
    volumes:
      - sqlvolume:/var/opt/mssql
      - ./backups:/backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/1433"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Express

  db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: sql_init
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Waiting for SQL Server to accept connections..."
        for i in {1..30}; do
          /opt/mssql-tools/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1
          if [ $$? -eq 0 ]; then
            echo "SQL Server is ready!"
            break
          fi
          echo "Not ready yet... waiting..."
          sleep 3
        done
        echo "Ensuring Database RequestHandlerWebServer exists..."
        /opt/mssql-tools/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'RequestHandlerWebServer') BEGIN CREATE DATABASE RequestHandlerWebServer; END;"
        echo "Init script finished."

  backend:
    build: ./backend
    container_name: backend_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      - TZ=Europe/Minsk
      - SPRING_R2DBC_URL=r2dbc:mssql://db:1433/RequestHandlerWebServer?encrypt=false&trustServerCertificate=true
      - SPRING_R2DBC_USERNAME=sa
      - SPRING_R2DBC_PASSWORD=${MSSQL_SA_PASSWORD}
      - SPRING_SQL_INIT_MODE=always
      - BOT_URL=http://bot:8081
      - BOT_API_KEY=${INTERNAL_API_KEY} 
      - FRONTEND_ALLOWED_ORIGINS=http://192.168.0.40,https://192.168.0.40,http://91.149.165.167,https://91.149.165.167,http://localhost,http://127.0.0.1,https://localhost,https://172.0.0.1
      - INITIAL_ADMIN_LOGIN=${INITIAL_ADMIN_LOGIN}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Europe/Minsk 
    networks:
      - app-network

  bot:
    build: ./telegram
    container_name: telegram_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    environment:
      - TZ=Europe/Minsk
      - BACKEND_URL=http://backend:8080
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=/
    container_name: frontend_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

  db-backup:
    image: mcr.microsoft.com/mssql-tools
    container_name: sql_backup
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    networks:
      - app-network
    entrypoint: >
      /bin/bash -c "
      while true; do
        echo '[backup] start at '$$(date);

        /opt/mssql-tools/bin/sqlcmd -S db -U sa -P $$MSSQL_SA_PASSWORD -Q \"BACKUP DATABASE RequestHandlerWebServer TO DISK = '/backups/RequestHandlerWebServer_$$(date +%Y%m%d_%H%M%S).bak' WITH INIT\";

        find /backups -type f -mtime +3 -delete;

        echo '[backup] done';

        sleep 86400;
      done
      "

volumes:
  sqlvolume:

networks:
  app-network:
    driver: bridge